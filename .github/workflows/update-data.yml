name: 일정 자동 업데이트

on:
  workflow_dispatch:
  schedule:
    # 한국시간 09:10 / 18:10
    - cron: "10 0,9 * * *"

permissions:
  contents: write
  issues: read

# 같은 시간에 두 번 돌지 않게 (손으로 '실행'을 누른 것과 예약 실행이 겹칠 때)
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"   # 진행 상황이 Actions 화면에 바로바로 보이게

    steps:
      - name: 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 일정 수집 (관광공사 · KOPIS · 문화정보원)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
        run: python scripts/update_data.py

      - name: 동네 강좌·도서관 수집 (주 1회)
        continue-on-error: true
        timeout-minutes: 40
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/collect_local.py

      - name: 정보 수정 제보 표시 (열린 이슈 읽기)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_flags.py

      - name: 반려견 동반 카페 공공데이터 수집 (관광공사 반려동물 동반여행)
        continue-on-error: true
        timeout-minutes: 15
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/collect_pets.py

      - name: 장소 위치·영업정보 보강 (빈칸만 채움)
        continue-on-error: true
        timeout-minutes: 30
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/enrich_places.py

      - name: 바뀐 데이터 저장
        run: |
          git config user.name "gwangju-eodi-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -r -q --cached --ignore-unmatch scripts/__pycache__
          git add -A docs/data
          [ -f scripts/place_cache.json ] && git add scripts/place_cache.json
          if git diff --cached --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "자동 일정 업데이트"
            # 수집하는 동안 웹에서 파일을 올렸으면(Add files via upload) 그대로 push 하면 거절된다 → 최신을 받아 위에 얹고 다시 시도
            for i in 1 2 3; do
              if git push; then break; fi
              echo "push 거절 → 최신 내용을 받아 다시 시도 ($i)"
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; git pull --no-rebase -X ours origin "${GITHUB_REF_NAME}"; }
              sleep 5
            done
            git push   # 세 번 다 실패했으면 여기서 실패로 표시돼 Actions 화면에서 알 수 있음
          fi
